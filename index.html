<style>

.note{color:var(--mute);font-size:13px;margin-top:10px}
.srow{transition:transform .2s ease;display:flex;gap:8px 10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .top{flex:1 1 100%;display:flex;gap:6px;align-items:center}.srow .nmi{flex:1;font-weight:600}
.grip{width:36px;height:44px;display:grid;place-items:center;color:var(--mute);font-size:22px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none;border-radius:10px}
.grip:active{background:var(--line)}
.srow.drag{position:relative;z-index:5;background:var(--card);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.35);user-select:none;transition:none}
.srow label{flex:1 1 90px}
.mv{display:flex;gap:6px;align-items:flex-end;flex:1 1 100%;justify-content:flex-end}
.mv button{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.mv .del{color:var(--no);padding:0 12px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
footer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 0;font-size:12px;color:var(--mute);padding:24px 12px 8px}
footer .soc{display:inline-flex;align-items:center;justify-content:center;width:40px;height:44px;color:var(--mute);opacity:.75;transition:color .25s,opacity .25s,transform .15s}
footer .li{margin-left:4px}

@media (hover:hover){footer .li:hover{color:#0a66c2;opacity:1}footer .ig:hover{opacity:1}footer .ig:hover .gs{stroke:url(#igg)}footer .ig:hover .gf{fill:url(#igg)}}
footer .li:active,footer .li:focus-visible{color:#0a66c2;opacity:1}

@media (hover:hover){footer .sh:hover{color:var(--acc);opacity:1}}
footer .sh:active,footer .sh:focus-visible{color:var(--acc);opacity:1}
.shbox{white-space:pre-wrap;overflow-wrap:anywhere;max-height:32vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:10px 0 14px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;line-height:1.45;user-select:text;-webkit-user-select:text}
.shbtns{display:grid;gap:8px}
.shbtns a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:600}
footer .ig:active,footer .ig:focus-visible{opacity:1}
footer .ig:active .gs,footer .ig:focus-visible .gs{stroke:url(#igg)}
footer .ig:active .gf,footer .ig:focus-visible .gf{fill:url(#igg)}
@media (prefers-color-scheme:dark){@media (hover:hover){footer .li:hover{color:#4d9de0}}footer .li:active,footer .li:focus-visible{color:#4d9de0}}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .3s ease both}
.ov[hidden]{display:none}
.ov.out{opacity:0;transition:opacity .28s ease}
.ov.out .mod{animation:modout .28s cubic-bezier(.4,0,1,1) both}
@keyframes modout{to{opacity:0;transform:translateY(10px) scale(.96)}}
.mod>*{animation:fade .5s cubic-bezier(.2,.8,.2,1) both}
.mod>:nth-child(2){animation-delay:60ms}.mod>:nth-child(3){animation-delay:110ms}.mod>:nth-child(4){animation-delay:160ms}.mod>:nth-child(5){animation-delay:210ms}.mod>:nth-child(6){animation-delay:260ms}
.view.in .card,.view.in .tools,.view.in .note,.view.in .legend{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.in>:nth-child(2){animation-delay:60ms}.view.in>:nth-child(3){animation-delay:120ms}.view.in>:nth-child(4){animation-delay:180ms}
.row{transition:border-color .25s,background-color .25s,transform .2s}
.adv{transition:background-color .3s}
@media (hover:hover){.btn:hover,.tools button:hover{border-color:var(--acc)}.b:hover{border-color:var(--mute)}nav button:hover:not([aria-selected=true]){background:var(--accbg)}}
@media (max-height:480px) and (orientation:landscape){.mod{padding:18px 20px}.mod h2{font-size:18px}}
.mod{width:100%;max-width:420px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.mod h2{margin:0 0 12px;font-size:21px;letter-spacing:-.01em}
.mod p{margin:0 0 12px;color:var(--ink);line-height:1.55}
.mod .by{color:var(--mute);font-size:14px;margin:4px 0 18px}
.mod .btn{width:100%}
.btn.cd{position:relative;overflow:hidden;opacity:.85;cursor:default}
.btn.cd::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0);animation:cdfill 10s linear forwards}
.btn.cd span{position:relative}
@keyframes cdfill{to{transform:scaleX(1)}}
.hid{position:fixed;left:0;top:0;opacity:.004;pointer-events:none;z-index:-1;display:block}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:600}
.acc{display:flex;align-items:center;justify-content:space-between;gap:12px}.acc .who{min-width:0;overflow-wrap:anywhere}

.sy.ok i{background:var(--ok);animation:none}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

.lgrow .legend{margin:0}
.xbtn{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px dashed var(--acc);background:transparent;color:var(--acc);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,background-color .2s}
.xbtn:active{transform:scale(.95);background:var(--accbg)}
.tag{font-size:11px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap;vertical-align:middle}
.xs{flex:1 1 100%;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.xs.new{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}

.xr{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;flex:none;transition:transform .12s}

.xlist{display:grid;gap:8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.xlist .btn{text-align:left;font-weight:600}
.cell.M{font-size:15px;letter-spacing:2px;white-space:nowrap}
.cell .P{color:var(--ok)}.cell .A{color:var(--no)}.cell .C{color:var(--na)}
.pl{margin-top:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.plh{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 14px;flex-wrap:wrap}

.plafter{font-size:20px;color:var(--ink)}.plafter.ok{color:var(--ok)}.plafter.no{color:var(--no)}
.plall .big{font-size:clamp(40px,13vw,56px);margin-top:4px}
.plall .plr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.plc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.stl{font-size:13px;color:var(--mute);font-weight:600}
.sbs{display:flex;align-items:center;gap:4px}

.sb:active{transform:scale(.88)}.sb:disabled{opacity:.35;cursor:default;transform:none}

.plf{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.plf .note{margin:0}.pill[hidden]{display:none}

.hl{min-width:0}

.moodtxt[data-c=ok]{color:var(--ok)}.moodtxt[data-c=no]{color:var(--no)}.moodtxt[data-c=na]{color:var(--na)}
.facew{position:relative;width:clamp(56px,17vw,70px);height:clamp(56px,17vw,70px);padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.face{display:block;width:100%;height:100%;overflow:visible}

@keyframes fbob{50%{transform:translateY(-2px)}}

.st{display:flex;flex-wrap:wrap;gap:0 10px}

.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px 12px;align-items:end;padding:14px 0}
.srow .top{grid-column:1/-1}

.mv{grid-column:3}
footer{padding:28px 12px 8px}
.srow .mv button,.srow .mv .del{min-height:44px}
@media (min-width:720px){.srow{grid-template-columns:minmax(0,1fr) 120px 120px auto}.srow .top{grid-column:auto}.mv{grid-column:auto}}

/* face: livelier bubble, toast, spin */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.facew{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bub{max-width:190px;font-size:13px;padding:9px 11px}
.facew.spin{animation:fspin .9s cubic-bezier(.3,1.3,.5,1)}
@keyframes fspin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:min(92vw,420px);padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:720px){.toast{bottom:28px}}
.mv button{min-height:44px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const KEY="attendance_tracker_v1",SYM={P:TK,A:XK,C:OC},LBL={P:"Attended",A:"Bunked",C:"Cancelled"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const D=()=>({v:2,ts:0,name:"",min:78,hap:true,subjects:[],open:{},log:{},plan:{}});
function migrate(o){
 if(!o||typeof o!=="object")return D();
 if(o.v===2){const n=Object.assign(D(),o);if(!n.plan||typeof n.plan!=="object")n.plan={};return n}

 ["Intro to R Programming","R Programming Lab","PBA","RM","HRM","SEC3","SEC4"].forEach((nm,i)=>{

 for(const d in o.log||{}){n.log[d]={};for(const i in o.log[d])n.log[d]["s"+i]=o.log[d][i]}
 return n}
let S=D();
try{const r=localStorage.getItem(KEY);if(r)S=migrate(JSON.parse(r))}catch(e){}

/* ===== Google sign-in + cross-device sync (Firebase). Paste your config into FB to enable; leave apiKey empty to stay local-only. ===== */
const FB={apiKey:"AIzaSyDd0T6BKbgUKO2oZ_KZbMQ6ytEXy9ZeCw4",authDomain:"bunkit-afd34.firebaseapp.com",projectId:"bunkit-afd34",appId:"1:1031053254191:web:e42f50a8c251fe17eb30da",measurementId:"G-3YVVQW8V9G"};
const UKEY="bunkit_synced_uid";
let auth=null,db=null,user=null,unsub=null,pushT=null,hold=false,syncState="off",authMsg="",firstSnap=true;

const hasData=()=>S.subjects.length>0||Object.keys(S.log).length>0;
function schedPush(){if(!user||hold)return;clearTimeout(pushT);pushT=setTimeout(pushNow,700)}
function pushNow(){
 clearTimeout(pushT);if(!user||!db||hold)return;
 syncState="sync";renderAcct();
 db.collection("users").doc(user.uid).set({data:JSON.stringify(S),ts:S.ts||Date.now(),updated:firebase.firestore.FieldValue.serverTimestamp()})

function parseRemote(d){try{const o=migrate(JSON.parse(d.data));o.ts=+d.ts||o.ts||0;return o}catch(e){return null}}

 S=o;try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(UKEY,user.uid)}catch(e){}
 shown=null;shownW=0;syncState="ok";renderAll();renderAcct()}
function reconcile(d){
 if(!d){pushNow();return}
 const r=parseRemote(d);if(!r)return;
 if(r.ts>(S.ts||0))applyRemote(r);
 else if(r.ts<(S.ts||0))pushNow();
 else{syncState="ok";try{localStorage.setItem(UKEY,user.uid)}catch(e){}renderAcct()}}
function askChoice(d){
 hold=true;const o=$("#syn"),b=$("#sbody");o.classList.remove("out");o.hidden=false;
 b.innerHTML=`<h2 id="st">Which data do you want?</h2><p>This device already has attendance data, and your Google account has saved data too.</p>
 <button class="btn pri" id="suse">Use my saved (cloud) data</button>
 <button class="btn" id="skeep" style="margin-top:8px">Keep this device’s data</button>
 <div class="note">“Keep” replaces the cloud copy with what’s on this device.</div>`;
 const done=()=>{o.classList.add("out");setTimeout(()=>{o.hidden=true},280);hold=false};
 $("#suse").onclick=()=>{buzz("P");done();const r=parseRemote(d);if(r)applyRemote(r)};
 $("#skeep").onclick=()=>{buzz("P");done();const r=parseRemote(d);S.ts=Math.max(Date.now(),(r?r.ts:0)+1);save();pushNow()};

const GIC='<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

function renderAcct(){
 const el=$("#acct");if(!el||!FB.apiKey)return;
 let h;
 if(user){
  const st=!navigator.onLine||syncState==="off2"?"Offline · changes will sync when you’re back online":syncState==="sync"?"Syncing…":syncState==="err"?"Couldn’t sync · will retry on your next change":"Synced on all your devices";

/* Anonymous usage stats (Google Analytics via Firebase). Stays OFF until FB.measurementId is filled in.
   Only event names like "mark" or "tab_view" are sent. Never names, subjects or attendance numbers. */
const AOFF="bunkit_analytics_off";let an=null;const AQ=[];
function aOn(){try{return !!FB.measurementId&&localStorage.getItem(AOFF)!=="1"&&navigator.doNotTrack!=="1"}catch(e){return !!FB.measurementId}}

function setAnalytics(on){try{localStorage.setItem(AOFF,on?"0":"1")}catch(e){}if(an)try{an.setAnalyticsCollectionEnabled(!!on)}catch(e){}if(on)initAnalytics()}
async function initCloud(){

/* A day's entry for a subject is either one mark ("P"/"A"/"C") or an array of marks (several lectures that day; "" = not marked yet). */
function marks(v){if(Array.isArray(v))return v.map(x=>(x==="P"||x==="A"||x==="C")?x:"");return(v==="P"||v==="A"||v==="C")?[v]:[]}
const getArr=(d,id)=>marks((S.log[d]||{})[id]);
function putArr(d,id,arr){const day=S.log[d]||(S.log[d]={});
 if(arr.length<=1){if(arr[0])day[id]=arr[0];else delete day[id]}else day[id]=arr;
 if(!Object.keys(day).length)delete S.log[d]}
function logStats(id){let h=0,a=0;
 for(const d in S.log)marks(S.log[d][id]).forEach(v=>{if(v==="P"){h++;a++}else if(v==="A")h++});return{h,a}}

function calc(h,a){const m=S.min/100;if(!h)return{p:null,skip:0,need:0,ok:true};
 const ok=a/h>=m-1e-9;let skip=0,need=0;
 if(ok)skip=Math.max(0,Math.floor(a/m-h+1e-9));else need=Math.max(1,Math.ceil((m*h-a)/(1-m)-1e-9));
 return{p:a/h,skip,need,ok}}

function paintPlan(){

 const fill=(el,pr)=>{const b=el.querySelector(".bar")||el,i=b.querySelector("i");b.classList.toggle("no",pr!=null&&pr<m-1e-9);bars.push([i,pr==null?0:Math.min(100,pr*100)])};
 S.subjects.forEach(sb=>{const s=stats(sb.id),p=gp(sb.id),nh=s.h+p.s+p.a,na=s.a+p.a;AH+=s.h;AA+=s.a;TH+=nh;TA+=na;TS+=p.s;TT+=p.a;
  const el=document.querySelector(`.pl[data-sub="${sb.id}"]`);if(!el)return;
  const pr=nh?na/nh:null,ok=pr!=null&&pr>=m-1e-9,k=calc(nh,na);
  el.querySelector(".plnow").textContent=pc(s.h?s.a/s.h:null);
  const af=el.querySelector(".plafter");af.textContent=pc(pr);af.className="plafter"+(pr==null?"":ok?" ok":" no");
  el.querySelectorAll("output").forEach(o=>{const[,kk]=o.dataset.n.split(":");o.textContent=p[kk]});
  el.querySelectorAll(".sb").forEach(b=>{const[,kk,d]=b.dataset.pl.split(":");b.disabled=(+d<0&&!p[kk])||(+d>0&&p[kk]>=PLMAX)});
  const pl=el.querySelector(".pill");pl.hidden=pr==null;pl.className="pill "+(ok?"ok":"no");pl.textContent=ok?"Safe":"Below "+S.min+"%";
  el.querySelector(".plnote").textContent=pr==null?"No lectures yet":ok?(k.skip>0?`Could still bunk ${k.skip} more`:"No more bunks left"):`Attend ${k.need} more to reach ${S.min}%`;
  fill(el,pr)});
 const all=$("#pa-big");if(!all)return;
 const pr=TH?TA/TH:null,ok=pr!=null&&pr>=m-1e-9,k=calc(TH,TA);
 all.textContent=pc(pr);all.className="big"+(pr==null?"":ok?" ok":" no");
 $("#pa-now").textContent="Now "+pc(AH?AA/AH:null);
 const pl=$("#pa-pill");pl.hidden=pr==null;pl.className="pill "+(ok?"ok":"no");pl.textContent=ok?"Safe":"Below "+S.min+"%";
 $("#pa-adv").innerHTML=pr==null?"Mark a lecture or add held lectures to start.":
  `${TS||TT?`Bunking <b>${pl_(TS,"lecture")}</b> and attending <b>${pl_(TT,"lecture")}</b>. `:"No plan yet. "}${ok?(k.skip>0?`You could still bunk <b>${pl_(k.skip,"more lecture")}</b>.`:"No more bunks left."):`You would need to attend <b>${pl_(k.need,"more lecture")}</b> in a row.`}`;
 fill($("#pa-bar").parentNode.querySelector("#pa-bar"),pr);
 requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(([i,w])=>{i.style.width=w+"%"})))}
const pl_=(n,w)=>n+" "+w+(n===1?"":"s");
function animFore(){const v=$("#fore"),bs=v.querySelectorAll(".bar i");if(!bs.length)return;
 bs.forEach(i=>{i.style.transition="none";i.style.width="0%"});void v.offsetWidth;
 bs.forEach(i=>{i.style.transition=""});setTimeout(paintPlan,200)}

function abbr(n){const w=n.trim().split(/\s+/);return w.length>1?w.map(x=>x[0]).join("").toUpperCase().slice(0,4):n.slice(0,4)}
function renderReg(){
 const ds=Object.keys(S.log).sort().reverse();let h=``;
 if(!ds.length||!S.subjects.length)h+=`<div class="card empty">No records yet.</div>`;
 else h+=`<div class="card scroll reg"><table><tr><th>Date</th>${S.subjects.map(s=>`<th title="${esc(s.name)}">${esc(abbr(s.name))}</th>`).join("")}</tr>
 ${ds.map(d=>`<tr><td>${fmt(d,{weekday:"short",day:"numeric",month:"short"})}</td>${S.subjects.map(s=>{const a=marks(S.log[d][s.id]);if(a.length>1)return`<td class="cell M" data-d="${d}" data-id="${s.id}" data-m="1" title="${a.length} lectures">${a.map(x=>`<span class="${x}">${x?SYM[x]:"·"}</span>`).join("")}</td>`;const v=a[0];return`<td class="cell ${v||""}" data-d="${d}" data-id="${s.id}">${v?SYM[v]:"·"}</td>`}).join("")}</tr>`).join("")}</table></div>
 <div class="note">Tap a cell to edit. A cell with several lectures opens that day.</div>`;
 $("#reg").innerHTML=h}

function renderSubj(){
 let h=`<div class="card">${S.subjects.length?`<div class="note" style="margin:0 0 4px">Held and attended update automatically as you mark lectures. You can also edit them to correct a total.</div>`:""}`;
 S.subjects.forEach(s=>{const o=stats(s.id);
  h+=`<div class="srow" data-row="${s.id}"><div class="top"><span class="grip" title="Hold and drag" aria-label="Hold and drag to reorder">⠿</span><input class="nmi" data-n="${s.id}" value="${esc(s.name)}" maxlength="40" aria-label="Subject name" autocomplete="off"></div>
  <label>Classes held<input type="number" inputmode="numeric" min="0" data-o="h" data-id="${s.id}" value="${o.h}"></label>
  <label>Attended<input type="number" inputmode="numeric" min="0" data-o="a" data-id="${s.id}" value="${o.a}"></label>
  <div class="mv"><button class="del" data-del="${s.id}">Remove</button></div></div>`});
 h+=`<textarea id="bulk" rows="3" aria-label="New subjects" style="margin-top:12px" placeholder="New subjects, one per line"></textarea>
 <div class="tools"><button class="btn pri" id="addb">Add</button></div></div>`;
 $("#subj").innerHTML=h}

function renderName(){const el=$("#namecard");if(el)el.innerHTML=`<label>Your name<input type="text" id="uname" maxlength="30" autocomplete="given-name" value="${esc(S.name||"")}"></label>`}
function renderAccount(){
 $("#account").innerHTML='<div class="card fin" id="namecard"></div>'+(FB.apiKey?'<div class="card" id="acct"></div>':"")+`<div class="card"><b>Backup and restore</b>
 <div class="note" style="margin:4px 0 0">Backup gives you text you can keep. Restore loads it back.</div>
 <div class="tools"><button id="exp">Backup</button><button id="imp">Restore</button></div><div id="bkp"></div></div>
 <div class="card"><b>Reset</b>
 <div class="note" style="margin:4px 0 0">Erases all your subjects and attendance${FB.apiKey?", including the synced copy if you’re signed in":""}. Your name is kept.</div>
 <div class="tools"><button class="dng" id="rst">Reset</button></div></div>
 ${FB.measurementId?`<div class="card"><label style="display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer"><input type="checkbox" id="anon" style="width:22px;height:22px;accent-color:var(--acc)" ${aOn()?"checked":""}> Share anonymous usage stats</label><div class="note" style="margin:6px 0 0">Helps improve the app. Your name, subjects and attendance are never sent.</div></div>`:""}
 <div class="note">${FB.apiKey?"Without signing in, your data is saved on this device only.":"Your data is saved on this device only."}</div>`;
 renderName();renderAcct()}
const renderMost=()=>{renderToday();renderFore();renderReg();paintCounts()};
const renderAll=()=>{renderMost();renderSubj();renderName()};

function show(t){
 track("tab_view",{tab:t});
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
 document.querySelectorAll(".view").forEach(v=>{const on=v.id===t;v.hidden=!on;v.classList.remove("in");if(on){void v.offsetWidth;v.classList.add("in");clearTimeout(v._t);v._t=setTimeout(()=>v.classList.remove("in"),800)}});
 if(t==="today"){enter=true;shown=null;shownW=0;renderToday()}if(t==="fore")animFore();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
 if(e.target.id==="xo")return closeXP();
 if(e.target.id==="shr")return closeShare();
 {const a=e.target.closest("#shwa,#shtg");if(a)track("share",{method:a.id==="shwa"?"whatsapp":"telegram"})}
 const t=e.target.closest("button,td.cell");if(!t)return;
 if(t.id==="shbtn"){buzz("C");return shareApp()}
 if(t.id==="shclose"){return closeShare()}
 if(t.id==="shcopy"){buzz("P");copyText(shareMsg(appUrl())).then(ok=>{t.textContent=ok?"Copied ✓":"Couldn’t copy. Select the text above.";track("share",{method:"copy"});setTimeout(()=>{t.textContent="Copy message"},2400)});return}
 if(t.id==="face"){if(FA.held){FA.held=false;return}buzz("C");return faceTap()}
 if(t.id==="xadd"){buzz("C");return openXP()}
 if(t.id==="xcancel"){return closeXP()}
 if(t.dataset.xs){buzz("P");return addSlot(t.dataset.xs)}
 if(t.dataset.xr){const[id,q]=t.dataset.xr.split(":"),arr=getArr(cur,id);arr.splice(+q,1);putArr(cur,id,arr);buzz("C");save();return renderMost()}
 if(t.dataset.pl){const[id,k,d]=t.dataset.pl.split(":");const p=S.plan[id]||(S.plan[id]={s:0,a:0});p[k]=Math.min(PLMAX,Math.max(0,(+p[k]||0)+ +d));if(!p.s&&!p.a)delete S.plan[id];buzz("C");save();return paintPlan()}
 if(t.id==="plclr"){buzz("C");S.plan={};save();return paintPlan()}
 if(t.id==="gin"){buzz("C");return signIn()}
 if(t.id==="gout"){buzz("C");return signOut()}
 if(t.dataset.t){buzz("C");return show(t.dataset.t)}
 if(t.classList.contains("b")&&t.dataset.v){buzz(t.dataset.v);return setMark(cur,t.dataset.id,t.dataset.v,+t.dataset.k||0)}
 if(t.id==="td"){cur=today;enter=true;return renderToday()}
 if(t.classList.contains("cell")){buzz("C");const d=t.dataset.d,id=t.dataset.id;
  if(t.dataset.m){cur=d;enter=true;return show("today")}
  const o=getArr(d,id)[0],n={undefined:"P",P:"A",A:"C",C:undefined}[o];
  putArr(d,id,[n||""]);save();return renderMost()}
 if(t.id==="addb"){const names=$("#bulk").value.split("\n").map(x=>x.trim().slice(0,40)).filter(Boolean);
  names.forEach(n=>{const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.subjects.push({id,name:n});S.open[id]={h:0,a:0}});track("subjects_added",{count:names.length});
  save();return renderAll()}
 if(t.dataset.del){if(!t.dataset.arm){t.dataset.arm=1;t.classList.add("armed");t.textContent="Confirm?";setTimeout(()=>{t.dataset.arm="";t.classList.remove("armed");t.textContent="Remove"},3000);return}
  const id=t.dataset.del;S.subjects=S.subjects.filter(s=>s.id!==id);delete S.open[id];delete S.plan[id];
  for(const d in S.log){delete S.log[d][id];if(!Object.keys(S.log[d]).length)delete S.log[d]}save();return renderAll()}
 if(t.id==="exp"){$("#bkp").innerHTML='<textarea id="bk" rows="5" readonly></textarea><div class="note">Copy and keep this text.</div>';
  const x=$("#bk");x.value=JSON.stringify(S);x.focus();x.select();try{navigator.clipboard.writeText(x.value).catch(()=>{})}catch(e){}}
 if(t.id==="imp")$("#bkp").innerHTML='<textarea id="bk" rows="5" placeholder="Paste backup"></textarea><div class="tools"><button id="go">Restore now</button></div><div class="note" id="bm"></div>';
 if(t.id==="go"){try{const o=JSON.parse($("#bk").value);if(o&&typeof o.log==="object"&&o.open&&(o.v!==2||Array.isArray(o.subjects))){S=migrate(o);save();shown=null;shownW=0;renderAll();$("#bkp").innerHTML='<div class="note">Backup restored.</div>'}else $("#bm").textContent="That text is not an attendance backup."}catch(x){$("#bm").textContent="That text could not be read."}}
 if(t.id==="rst"){if(!t.dataset.arm){t.dataset.arm=1;t.classList.add("armed");t.textContent="Confirm?";clearTimeout(t._t);t._t=setTimeout(()=>{t.dataset.arm="";t.classList.remove("armed");t.textContent="Reset"},4000)}
  else{clearTimeout(t._t);t.dataset.arm="";t.classList.remove("armed");t.textContent="Reset";const nm=S.name;S=D();S.name=nm;save();shown=null;shownW=0;renderAll();$("#bkp").innerHTML='<div class="note">All data has been reset.</div>'}}
});
document.addEventListener("pointerdown",e=>{
 const g=e.target.closest(".grip");if(!g)return;
 e.preventDefault();
 const row=g.closest(".srow"),rows=[...document.querySelectorAll("#subj .srow")],from=rows.indexOf(row),sc0=scrollY;
 const top=rows.map(r=>r.getBoundingClientRect().top+sc0),hs=rows.map(r=>r.getBoundingClientRect().height),h=hs[from];
 let y=e.clientY,to=from;const y0=y;
 try{g.setPointerCapture(e.pointerId)}catch(_){}
 row.classList.add("drag");buzz("C");
 const upd=()=>{
  const dy=y-y0+scrollY-sc0,c=top[from]+h/2+dy;
  row.style.transform=`translateY(${dy}px) scale(1.02)`;
  const n=rows.filter((r,i)=>i!==from&&top[i]+hs[i]/2<c).length;
  if(n!==to){to=n;buzz("C")}
  rows.forEach((r,i)=>{if(i===from)return;
   r.style.transform=(from<to&&i>from&&i<=to)?`translateY(${-h}px)`:(from>to&&i>=to&&i<from)?`translateY(${h}px)`:""})};
 const mv=ev=>{y=ev.clientY;upd()};
 const iv=setInterval(()=>{if(y<80)scrollBy(0,-12);else if(y>innerHeight-80)scrollBy(0,12);else return;upd()},16);
 const end=()=>{clearInterval(iv);g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",end);g.removeEventListener("pointercancel",end);
  if(to!==from){const [m]=S.subjects.splice(from,1);S.subjects.splice(to,0,m);save()}
  renderAll()};
 g.addEventListener("pointermove",mv);g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);upd()});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="uname"){S.name=t.value.trim().slice(0,30);save()}
 else if(t.id==="anon"){setAnalytics(t.checked)}
 else if(t.id==="min"){const o=S.min;S.min=Math.min(99,Math.max(1,+t.value||78));save();renderMost();if(S.min!==o)faceReact(S.min>o?"RU":"RD")}
 else if(t.id==="dt"){cur=t.value&&t.value<=today?t.value:today;enter=true;renderToday()}
 else if(t.dataset.o){const id=t.dataset.id,k=t.dataset.o,o=S.open[id]||(S.open[id]={h:0,a:0});o[k]=Math.max(0,Math.round(+t.value||0)-logStats(id)[k]);save();renderMost()}
 else if(t.dataset.n){const s=S.subjects.find(x=>x.id===t.dataset.n),v=t.value.trim();if(v)s.name=v;else t.value=s.name;save();renderMost()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeXP();closeShare()}});
document.addEventListener("visibilitychange",()=>{
 const n=iso(new Date());if(!document.hidden&&n!==today){if(cur===today)cur=n;today=n;renderMost()}});
(function(){let seen=null;try{seen=localStorage.getItem("attendance_welcome_v1")}catch(e){}
 if(seen)return;const w=$("#wel"),b=$("#wbody");w.hidden=false;
 const close=()=>{try{localStorage.setItem("attendance_welcome_v1","1")}catch(e){}track("onboard_complete");
  w.classList.add("out");setTimeout(()=>{w.hidden=true;shown=null;shownW=0;enter=true;renderToday()},260);document.removeEventListener("keydown",onKey)};
 window._closeWel=close;
 let locked=false,tick=null;
 const onKey=e=>{if(e.key==="Escape"&&!locked)close()};
 const step2=()=>{const n=S.name?esc(S.name):"";
  b.innerHTML=`<h2 id="wt">${n?"Hello, "+n:"Hello, and welcome"}</h2>
  <p>This tool was made with care to help you manage your attendance and your focus without the stress.</p>
  <p>College is so much more than lectures. It’s friends, laughter and growing into yourself. I hope this helps you make time for both: bunking with friends, and the productivity to look after yourself and your goals.</p>
  <p>Be kind to yourself${n?", "+n:""}, and enjoy every bit of the journey.</p><div class="by">With warmth, Kunsh S Agarwal</div>
  <button class="btn pri cd" id="wok" disabled><span>Let’s begin (10)</span></button>`;
  const ok=$("#wok");let left=10;locked=true;
  tick=setInterval(()=>{left--;
   if(left>0){ok.firstChild.textContent="Let’s begin ("+left+")";return}
   clearInterval(tick);locked=false;ok.disabled=false;ok.classList.remove("cd");ok.textContent="Let’s begin";buzz("P");ok.focus()},1000);
  ok.onclick=()=>{clearInterval(tick);close()}};
 const step1=()=>{b.innerHTML=`<h2 id="wt">Welcome</h2><p>What should we call you?</p>
  <input type="text" id="wn" maxlength="30" autocomplete="given-name" placeholder="Your name" aria-label="Your name">
  <button class="btn pri" id="wgo" style="margin-top:14px">Continue</button>
  <button class="btn" id="wsk" style="margin-top:6px;border:0;background:none;color:var(--mute)">Skip</button>`;
  const go=()=>{S.name=$("#wn").value.trim().slice(0,30);save();renderName();step2()};
  $("#wgo").onclick=go;$("#wsk").onclick=step2;
  $("#wn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go()}});$("#wn").focus()};
 document.addEventListener("keydown",onKey);step1()})();
renderAll();renderAccount();paintAvatar();initCloud();
track("app_open",{display:matchMedia("(display-mode: standalone)").matches?"installed":"browser"});
addEventListener("appinstalled",()=>track("pwa_install"));
/* Auto-update: when the app is opened/returned to while online, check for a newer index.html and reload into it. */
if("serviceWorker" in navigator){
 let reg=null,base=null,last=0;
 const stamp=async()=>{try{const r=await fetch("index.html",{cache:"no-cache"});return r.ok?(r.headers.get("etag")||r.headers.get("last-modified")):null}catch(e){return null}};
 const busy=()=>{const a=document.activeElement;return(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||!!document.querySelector("#wel:not([hidden])")};
 const check=async()=>{const n=Date.now();if(!navigator.onLine||n-last<5000)return;last=n;
  try{if(reg)reg.update()}catch(e){}
  const v=await stamp();if(!v)return;
  if(base===null){base=v;return}
  if(v!==base){if(busy()){last=0;return}location.reload()}};
 addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").then(r=>{reg=r}).catch(()=>{})}catch(e){}check()});
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
 addEventListener("online",check);
}
