<script>
const KEY="attendance_tracker_v1",SYM={P:"✔",A:"✘",C:"−"},LBL={P:"Attended",A:"Absent",C:"Cancelled"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const D=()=>({v:2,ts:0,name:"",min:78,hap:true,subjects:[],open:{},log:{}});
function migrate(o){
 if(!o||typeof o!=="object")return D();
 if(o.v===2)return Object.assign(D(),o);
 const n=D();n.min=o.min||78;
 ["Intro to R Programming","R Programming Lab","PBA","RM","HRM","SEC3","SEC4"].forEach((nm,i)=>{
  n.subjects.push({id:"s"+i,name:nm});const p=(o.open||[])[i]||{};n.open["s"+i]={h:+p.h||0,a:+p.a||0}});
 for(const d in o.log||{}){n.log[d]={};for(const i in o.log[d])n.log[d]["s"+i]=o.log[d][i]}
 return n}
let S=D();
try{const r=localStorage.getItem(KEY);if(r)S=migrate(JSON.parse(r))}catch(e){}

let today=iso(new Date()),cur=today,fN=1,fM=0,enter=true,lastPop=null,shown=null,shownW=0;

function buzz(k){
 if(S.hap===false)return;
 try{
  if(navigator.vibrate&&navigator.vibrate(k==="P"?[16]:k==="A"?[28,40,28]:[9]))return;
  const l=$("#hl");if(!l)return;
  l.click();if(k==="A"){const l2=$("#hl2");if(l2)l2.click()}
 }catch(e){}}


/* ===== Google sign-in + cross-device sync (Firebase). Paste your config into FB to enable; leave apiKey empty to stay local-only. ===== */
const FB={apiKey:"AIzaSyDd0T6BKbgUKO2oZ_KZbMQ6ytEXy9ZeCw4",authDomain:"bunkit-afd34.firebaseapp.com",projectId:"bunkit-afd34",appId:"1:1031053254191:web:e42f50a8c251fe17eb30da"};
const UKEY="bunkit_synced_uid";
let auth=null,db=null,user=null,unsub=null,pushT=null,hold=false,syncState="off",authMsg="",firstSnap=true;

function pushNow(){
 clearTimeout(pushT);if(!user||!db||hold)return;
 syncState="sync";renderAcct();
 db.collection("users").doc(user.uid).set({data:JSON.stringify(S),ts:S.ts||Date.now(),updated:firebase.firestore.FieldValue.serverTimestamp()})
  .then(()=>{syncState="ok";try{localStorage.setItem(UKEY,user.uid)}catch(e){}renderAcct()})

function parseRemote(d){try{const o=migrate(JSON.parse(d.data));o.ts=+d.ts||o.ts||0;return o}catch(e){return null}}
function applyRemote(o){
 S=o;try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(UKEY,user.uid)}catch(e){}
 shown=null;shownW=0;syncState="ok";renderAll();renderAcct()}
function reconcile(d){
 if(!d){pushNow();return}
 const r=parseRemote(d);if(!r)return;
 if(r.ts>(S.ts||0))applyRemote(r);
 else if(r.ts<(S.ts||0))pushNow();
 else{syncState="ok";try{localStorage.setItem(UKEY,user.uid)}catch(e){}renderAcct()}}
function askChoice(d){
 hold=true;const o=$("#syn"),b=$("#sbody");o.classList.remove("out");o.hidden=false;
 b.innerHTML=`<h2 id="st">Which data do you want?</h2><p>This device already has attendance data, and your Google account has saved data too.</p>
 <button class="btn pri" id="suse">Use my saved (cloud) data</button>
 <button class="btn" id="skeep" style="margin-top:8px">Keep this device’s data</button>
 <div class="note">“Keep” replaces the cloud copy with what’s on this device.</div>`;
 const done=()=>{o.classList.add("out");setTimeout(()=>{o.hidden=true},280);hold=false};
 $("#suse").onclick=()=>{buzz("P");done();const r=parseRemote(d);if(r)applyRemote(r)};
 $("#skeep").onclick=()=>{buzz("P");done();const r=parseRemote(d);S.ts=Math.max(Date.now(),(r?r.ts:0)+1);save();pushNow()};
 setTimeout(()=>$("#suse").focus(),60)}
function firstSync(d){
 if(!d){pushNow();return}
 const same=localStorage.getItem(UKEY)===user.uid;
 if(!hasData()||same)return reconcile(d);
 const r=parseRemote(d);if(r&&r.ts===S.ts)return reconcile(d);
 askChoice(d)}
function onUser(u){
 user=u;if(unsub){unsub();unsub=null}
 authMsg="";firstSnap=true;
 if(!u){syncState="off";renderAcct();return}
 syncState="sync";renderAcct();
 if(window._closeWel&&!$("#wel").hidden)window._closeWel();
 unsub=db.collection("users").doc(u.uid).onSnapshot(snap=>{
  if(snap.metadata.hasPendingWrites)return;
  if(snap.metadata.fromCache){syncState="off2";renderAcct();return}
  const d=snap.exists?snap.data():null;

  ()=>{syncState="err";renderAcct()})}
async function signIn(){

  if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await auth.signInWithRedirect(p)}catch(_){}}

addEventListener("offline",renderAcct);

function stats(id){const o=S.open[id]||{};let h=+o.h||0,a=+o.a||0;
 for(const d in S.log){const v=S.log[d][id];if(v==="P"){h++;a++}else if(v==="A")h++}return{h,a}}
function totals(){let h=0,a=0;S.subjects.forEach(s=>{const x=stats(s.id);h+=x.h;a+=x.a});return{h,a}}
function calc(h,a){const m=S.min/100;if(!h)return{p:null,skip:0,need:0,ok:true};
 const ok=a/h>=m-1e-9;let skip=0,need=0;
 if(ok)skip=Math.max(0,Math.floor(a/m-h+1e-9));else need=Math.max(1,Math.ceil((m*h-a)/(1-m)-1e-9));
 return{p:a/h,skip,need,ok}}
const pc=p=>p==null?"–":(p*100).toFixed(1)+"%";
const pl=(n,w)=>n+" "+w+(n===1?"":"s");
function advice(c){
 if(c.p==null)return"Mark a lecture to start.";
 if(!c.ok)return`Attend the next <b>${pl(c.need,"lecture")}</b> in a row`;
 if(c.skip===0)return"Don’t bunk the next lecture";
 return`You can bunk <b>${pl(c.skip,"lecture")}</b>`}

function setMark(d,id,v){
 const day=S.log[d]||(S.log[d]={});
 if(day[id]===v)delete day[id];else{day[id]=v;lastPop={id,v}}
 if(!Object.keys(day).length)delete S.log[d];
 save();renderMost()}

function renderToday(){
 const t=totals(),c=calc(t.h,t.a),day=S.log[cur]||{},en=enter;enter=false;
 let list="";
 if(!S.subjects.length)list=`<div class="card empty"><button class="btn pri" data-t="subj">Add your subjects</button></div>`;
 S.subjects.forEach((sb,i)=>{const s=stats(sb.id),k=calc(s.h,s.a),v=day[sb.id];
  const ex=k.p==null?"":k.ok?(k.skip>0?`<span class="ok">can bunk ${k.skip}</span>`:""):`<span class="no">attend ${k.need} more</span>`;
  list+=`<div class="row" style="--i:${i+1}"><div class="info"><div class="nm">${esc(sb.name)}</div><div class="st">${s.a}/${s.h} · ${pc(k.p)}${ex?" · "+ex:""}</div></div>
  <div class="btns">${["P","A","C"].map(x=>`<button class="b ${v===x?"sel "+x:""}${lastPop&&lastPop.id===sb.id&&lastPop.v===x?" pop":""}" data-id="${sb.id}" data-v="${x}" aria-pressed="${v===x}" aria-label="${esc(sb.name)}: ${LBL[x]}">${SYM[x]}</button>`).join("")}</div></div>`});
 lastPop=null;
 $("#tmain").innerHTML=`<div class="tgrid ${en?"enter":""}"><aside><div class="hero"><div class="tgt">Required<br><input type="number" inputmode="numeric" id="min" min="1" max="99" value="${S.min}" aria-label="Required attendance percent"> %</div>
 <div class="sub">Overall attendance</div><div class="big ${c.p==null?"":c.ok?"ok":"no"}" id="bigp">${pc(c.p)}</div>
 <div class="sub">${t.a} / ${t.h} lectures</div>
 <div class="bar ${c.ok?"":"no"}"><i id="fill"></i><u style="left:${S.min}%"></u></div>
 <div class="adv">${advice(c)}</div></div></aside>
 <div><div class="datebar"><b>${cur===today?"Today, ":""}${fmt(cur,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b>
 <span><input type="date" id="dt" value="${cur}" max="${today}" aria-label="Date to mark">${cur!==today?` <button class="btn" id="td">Back to today</button>`:""}</span></div>
 <div class="legend">✔ Attended &nbsp; ✘ Absent &nbsp; − Cancelled (not counted)</div>${list}</div></div>`;
 if(c.p==null){shown=null;shownW=0;return}
 const to=c.p*100,from=shown==null?0:shown,el=$("#bigp"),f=$("#fill");
 f.style.width=shownW+"%";
 requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=Math.min(100,to)+"%"}));
 if(!RM&&from!==to){const t0=performance.now();(function step(n){const k=Math.min(1,(n-t0)/650),e=1-Math.pow(1-k,3);
  el.textContent=(from+(to-from)*e).toFixed(1)+"%";if(k<1)requestAnimationFrame(step)})(t0)}
 shown=to;shownW=Math.min(100,to)}

function renderFore(){

</div>

function foreRes(){

 rows.forEach(([n,s],j)=>{const now=s.h?s.a/s.h:null,nh=s.h+fN+fM,p=nh?(s.a+fM)/nh:null,ok=p!=null&&p>=S.min/100-1e-9;

function abbr(n){const w=n.trim().split(/\s+/);return w.length>1?w.map(x=>x[0]).join("").toUpperCase().slice(0,4):n.slice(0,5)}
function renderReg(){

  else{const nm=S.name;S=D();S.name=nm;save();shown=null;shownW=0;renderAll()}}
});
document.addEventListener("pointerdown",e=>{
 const g=e.target.closest(".grip");if(!g)return;
 e.preventDefault();
 const row=g.closest(".srow"),rows=[...document.querySelectorAll("#subj .srow")],from=rows.indexOf(row),sc0=scrollY;
 const top=rows.map(r=>r.getBoundingClientRect().top+sc0),hs=rows.map(r=>r.getBoundingClientRect().height),h=hs[from];
 let y=e.clientY,to=from;const y0=y;

  const dy=y-y0+scrollY-sc0,c=top[from]+h/2+dy;

  if(to!==from){const [m]=S.subjects.splice(from,1);S.subjects.splice(to,0,m);save()}
  renderAll()};
 g.addEventListener("pointermove",mv);g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);upd()});
document.addEventListener("change",e=>{

});

 document.addEventListener("keydown",onKey);step1()})();
renderAll();initCloud();
if("serviceWorker" in navigator)addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}});
